		<stop offset="1" stop-color="#f4ead0" stop-opacity="0"/>
	</radialGradient>
	<radialGradient id="horizonGlow" cx="50%" cy="50%" r="50%">
		<stop offset="0" stop-color="#2b3f7d" stop-opacity="0.55"/>
		<stop offset="1" stop-color="#2b3f7d" stop-opacity="0"/>
	</radialGradient>
	<linearGradient id="silhouette" x1="0" y1="0" x2="0" y2="1">
		<stop offset="0" stop-color="#0a0f24"/>
		<stop offset="1" stop-color="#03040c"/>
