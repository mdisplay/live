<svg xmlns="http://www.w3.org/2000/svg" version="1.1" style="display: block;" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
<defs>
	<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
		<stop offset="0" stop-color="#03181d"/>
		<stop offset="0.5" stop-color="#07332f"/>
		<stop offset="0.78" stop-color="#0e5248"/>
		<stop offset="1" stop-color="#17695a"/>
	</linearGradient>
	<radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
		<stop offset="0" stop-color="#ffedb8" stop-opacity="0.9"/>
		<stop offset="0.35" stop-color="#ffe9b0" stop-opacity="0.38"/>
		<stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
	</radialGradient>
	<radialGradient id="horizonGlow" cx="50%" cy="50%" r="50%">
		<stop offset="0" stop-color="#e8c15a" stop-opacity="0.22"/>
		<stop offset="1" stop-color="#e8c15a" stop-opacity="0"/>
	</radialGradient>
	<linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
		<stop offset="0" stop-color="#0d3d3a"/>
		<stop offset="1" stop-color="#031417"/>
	</linearGradient>
	<linearGradient id="sunColumn" x1="0" y1="0" x2="0" y2="1">
		<stop offset="0" stop-color="#ffe9b0" stop-opacity="0.55"/>
		<stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
	</linearGradient>
	<g id="palmLeft">
		<path d="M 150,1080 C 156,920 162,740 172,580 L 198,580 C 190,740 186,920 182,1080 Z" fill="#03201f"/>
		<g fill="none" stroke="#03201f" stroke-width="26" stroke-linecap="round">
			<path d="M 185,580 Q 120,510 30,530"/>
			<path d="M 185,580 Q 105,560 35,600"/>
			<path d="M 185,580 Q 115,620 55,680"/>
			<path d="M 185,580 Q 250,510 340,530"/>
			<path d="M 185,580 Q 265,560 335,600"/>
			<path d="M 185,580 Q 255,620 315,680"/>
			<path d="M 185,580 Q 185,500 185,440"/>
			<path d="M 185,580 Q 240,530 300,520"/>
		</g>
		<circle cx="165" cy="600" r="14" fill="#03201f"/>
		<circle cx="205" cy="600" r="14" fill="#03201f"/>
	</g>
</defs>
<rect x="0" y="0" width="1920" height="1080" fill="url(#sky)"/>
<!-- morning sun + glow, upper right -->
<circle cx="1350" cy="330" r="330" fill="url(#sunGlow)"/>
<circle cx="1350" cy="330" r="55" fill="#ffedb8" opacity="0.95"/>
<!-- faint stars fading into morning -->
<g fill="#ffffff">
	<circle cx="120" cy="90" r="2" opacity="0.5"/>
	<circle cx="300" cy="180" r="1.6" opacity="0.4"/>
	<circle cx="480" cy="80" r="2.2" opacity="0.5"/>
	<circle cx="640" cy="200" r="1.4" opacity="0.35"/>
	<circle cx="820" cy="90" r="2" opacity="0.45"/>
	<circle cx="980" cy="190" r="1.5" opacity="0.35"/>
	<circle cx="150" cy="320" r="1.5" opacity="0.35"/>
	<circle cx="560" cy="330" r="1.3" opacity="0.3"/>
	<circle cx="740" cy="300" r="1.7" opacity="0.4"/>
	<circle cx="1700" cy="130" r="1.8" opacity="0.45"/>
	<circle cx="1830" cy="260" r="1.5" opacity="0.35"/>
	<circle cx="1600" cy="420" r="1.3" opacity="0.3"/>
	<circle cx="240" cy="430" r="1.4" opacity="0.3"/>
	<circle cx="1050" cy="120" r="1.6" opacity="0.4"/>
	<circle cx="420" cy="260" r="1.2" opacity="0.3"/>
</g>
<!-- birds -->
<g stroke="#062a28" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9">
	<path d="M 880,220 Q 900,205 920,220 Q 940,205 960,220"/>
	<path d="M 1010,170 Q 1024,159 1038,170 Q 1052,159 1066,170"/>
	<path d="M 760,280 Q 774,271 788,280 Q 802,271 816,280"/>
</g>
<!-- horizon glow -->
<ellipse cx="960" cy="860" rx="900" ry="170" fill="url(#horizonGlow)"/>
<!-- distant mosque silhouette, center -->
<g fill="#062a28">
	<path d="M 830,880 A 130 130 0 0 1 1090,880 Z"/>
	<rect x="955" y="700" width="10" height="60"/>
	<circle cx="960" cy="694" r="9" fill="#e8c15a"/>
	<rect x="770" y="640" width="26" height="240"/>
	<rect x="760" y="690" width="46" height="14"/>
	<rect x="760" y="750" width="46" height="14"/>
	<path d="M 770,640 L 783,600 L 796,640 Z"/>
	<rect x="1124" y="640" width="26" height="240"/>
	<rect x="1114" y="690" width="46" height="14"/>
	<rect x="1114" y="750" width="46" height="14"/>
	<path d="M 1124,640 L 1137,600 L 1150,640 Z"/>
	<path d="M 640,880 A 70 70 0 0 1 780,880 Z"/>
	<path d="M 1140,880 A 70 70 0 0 1 1280,880 Z"/>
	<rect x="500" y="790" width="90" height="90"/>
	<rect x="1330" y="790" width="90" height="90"/>
</g>
<g fill="#e8c15a" opacity="0.9">
	<circle cx="960" cy="810" r="6"/>
	<circle cx="600" cy="835" r="5"/>
	<circle cx="1320" cy="835" r="5"/>
	<circle cx="783" cy="668" r="4"/>
	<rect x="778" y="712" width="10" height="14"/>
	<circle cx="1137" cy="668" r="4"/>
	<rect x="1132" y="712" width="10" height="14"/>
</g>
<!-- ground band -->
<rect x="0" y="880" width="1920" height="200" fill="#03191c"/>
<!-- water with reflections -->
<rect x="0" y="900" width="1920" height="180" fill="url(#water)" opacity="0.92"/>
<rect x="1290" y="900" width="120" height="180" fill="url(#sunColumn)"/>
<g fill="#ffe9b0" opacity="0.28">
	<rect x="200" y="940" width="130" height="7" rx="3.5"/>
	<rect x="520" y="975" width="200" height="7" rx="3.5"/>
	<rect x="880" y="945" width="150" height="7" rx="3.5"/>
	<rect x="1180" y="985" width="90" height="7" rx="3.5"/>
	<rect x="1560" y="950" width="170" height="7" rx="3.5"/>
	<rect x="340" y="1015" width="100" height="6" rx="3"/>
	<rect x="760" y="1020" width="220" height="6" rx="3"/>
	<rect x="1290" y="990" width="120" height="8" rx="4" opacity="0.7"/>
	<rect x="1310" y="1025" width="80" height="6" rx="3" opacity="0.7"/>
	<rect x="1640" y="1018" width="130" height="6" rx="3"/>
</g>
<g fill="#ffffff" opacity="0.35">
	<rect x="420" y="958" width="90" height="5" rx="2.5"/>
	<rect x="980" y="1002" width="140" height="5" rx="2.5"/>
	<rect x="1480" y="982" width="70" height="5" rx="2.5"/>
	<rect x="120" y="990" width="80" height="5" rx="2.5"/>
</g>
<!-- palms framing the scene -->
<use href="#palmLeft"/>
<use href="#palmLeft" transform="translate(1920,0) scale(-1,1) translate(-60,80) scale(0.88)"/>
<!-- fireflies -->
<g fill="#ffe9b0">
	<circle cx="260" cy="700" r="4" opacity="0.8"/>
	<circle cx="330" cy="640" r="3" opacity="0.6"/>
	<circle cx="1680" cy="720" r="4" opacity="0.8"/>
	<circle cx="1600" cy="660" r="3" opacity="0.6"/>
	<circle cx="480" cy="760" r="3" opacity="0.5"/>
	<circle cx="1450" cy="770" r="3" opacity="0.5"/>
	<circle cx="700" cy="680" r="2.5" opacity="0.5"/>
	<circle cx="1230" cy="690" r="2.5" opacity="0.5"/>
</g>
</svg>
